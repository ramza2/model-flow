services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-source:
    image: postgres:16.9-alpine
    profiles: ["source"]
    environment:
      POSTGRES_USER: ${SOURCE_POSTGRES_USER:?SOURCE_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${SOURCE_POSTGRES_PASSWORD:?SOURCE_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${SOURCE_POSTGRES_DB:?SOURCE_POSTGRES_DB is required}
    ports:
      - "${SOURCE_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_source_data:/var/lib/postgresql/data
      - ./scripts/init-source.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql-source:
    image: mysql:8.4.5
    profiles: ["source"]
    environment:
      MYSQL_ROOT_PASSWORD: ${SOURCE_MYSQL_ROOT_PASSWORD:?SOURCE_MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${SOURCE_MYSQL_DB:?SOURCE_MYSQL_DB is required}
      MYSQL_USER: ${SOURCE_MYSQL_USER:?SOURCE_MYSQL_USER is required}
      MYSQL_PASSWORD: ${SOURCE_MYSQL_PASSWORD:?SOURCE_MYSQL_PASSWORD is required}
    ports:
      - "${SOURCE_MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_source_data:/var/lib/mysql
      - ./scripts/init-mysql-source.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  mariadb-source:
    image: mariadb:11.4.5
    profiles: ["source"]
    environment:
      MARIADB_ROOT_PASSWORD: ${SOURCE_MARIADB_ROOT_PASSWORD:?SOURCE_MARIADB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${SOURCE_MARIADB_DB:?SOURCE_MARIADB_DB is required}
      MARIADB_USER: ${SOURCE_MARIADB_USER:?SOURCE_MARIADB_USER is required}
      MARIADB_PASSWORD: ${SOURCE_MARIADB_PASSWORD:?SOURCE_MARIADB_PASSWORD is required}
    ports:
      - "${SOURCE_MARIADB_HOST_PORT:-3308}:3306"
    volumes:
      - mariadb_source_data:/var/lib/mysql
      - ./scripts/init-mysql-source.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "healthcheck.sh --connect --innodb_initialized",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  # Exact tag pull-verified (2026-09-18): mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
  # digest sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
  mssql-source:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    profiles: ["source"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SOURCE_MSSQL_SA_PASSWORD:?SOURCE_MSSQL_SA_PASSWORD is required}
      MSSQL_PID: Developer
    ports:
      - "${SOURCE_MSSQL_HOST_PORT:-14333}:1433"
    volumes:
      - mssql_source_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  mssql-source-init:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    profiles: ["source"]
    depends_on:
      mssql-source:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      SOURCE_MSSQL_HOST: mssql-source
      SOURCE_MSSQL_SA_PASSWORD: ${SOURCE_MSSQL_SA_PASSWORD:?SOURCE_MSSQL_SA_PASSWORD is required}
      SOURCE_MSSQL_DB: ${SOURCE_MSSQL_DB:?SOURCE_MSSQL_DB is required}
      SOURCE_MSSQL_USER: ${SOURCE_MSSQL_USER:?SOURCE_MSSQL_USER is required}
      SOURCE_MSSQL_PASSWORD: ${SOURCE_MSSQL_PASSWORD:?SOURCE_MSSQL_PASSWORD is required}
    volumes:
      - ./scripts/init-mssql-source.sh:/init-mssql-source.sh:ro
    entrypoint: ["/bin/bash", "/init-mssql-source.sh"]
    restart: "no"

  # Exact tag pull-verified (2026-09-21): gvenzl/oracle-free:23.26.3-slim-faststart
  # digest sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093
  oracle-source:
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    profiles: ["source"]
    environment:
      ORACLE_PASSWORD: ${SOURCE_ORACLE_SYSTEM_PASSWORD:?SOURCE_ORACLE_SYSTEM_PASSWORD is required}
      APP_USER: ${SOURCE_ORACLE_APP_USER:?SOURCE_ORACLE_APP_USER is required}
      APP_USER_PASSWORD: ${SOURCE_ORACLE_APP_PASSWORD:?SOURCE_ORACLE_APP_PASSWORD is required}
    ports:
      - "${SOURCE_ORACLE_HOST_PORT:-15211}:1521"
    volumes:
      - oracle_source_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 40s

  oracle-source-init:
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    profiles: ["source"]
    depends_on:
      oracle-source:
        condition: service_healthy
    environment:
      SOURCE_ORACLE_HOST: oracle-source
      SOURCE_ORACLE_SYSTEM_PASSWORD: ${SOURCE_ORACLE_SYSTEM_PASSWORD:?SOURCE_ORACLE_SYSTEM_PASSWORD is required}
      SOURCE_ORACLE_SERVICE_NAME: ${SOURCE_ORACLE_SERVICE_NAME:?SOURCE_ORACLE_SERVICE_NAME is required}
      SOURCE_ORACLE_APP_USER: ${SOURCE_ORACLE_APP_USER:?SOURCE_ORACLE_APP_USER is required}
      SOURCE_ORACLE_APP_PASSWORD: ${SOURCE_ORACLE_APP_PASSWORD:?SOURCE_ORACLE_APP_PASSWORD is required}
      SOURCE_ORACLE_USER: ${SOURCE_ORACLE_USER:?SOURCE_ORACLE_USER is required}
      SOURCE_ORACLE_PASSWORD: ${SOURCE_ORACLE_PASSWORD:?SOURCE_ORACLE_PASSWORD is required}
    volumes:
      - ./scripts/init-oracle-source.sh:/init-oracle-source.sh:ro
    entrypoint: ["/bin/bash", "/init-oracle-source.sh"]
    restart: "no"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    entrypoint: >
      /bin/sh -c 'set -eu;
      MC_HOST_local="http://$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD@minio:9000";
      export MC_HOST_local;
      mc mb -p local/datasets || true;
      mc mb -p local/mlflow || true;
      mc mb -p local/batch-results || true;
      mc mb -p local/artifacts || true;
      exit 0'

  mlflow:
    build:
      context: ./infra/mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      AWS_DEFAULT_REGION: us-east-1
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts mlflow:5000,localhost:*,127.0.0.1:*
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/mlflow
      --default-artifact-root s3://mlflow/
      --serve-artifacts
    ports:
      - "${MLFLOW_HOST_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_SECURE: "false"
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      AWS_DEFAULT_REGION: us-east-1
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      MODELFLOW_SECRET_KEY: ${MODELFLOW_SECRET_KEY:?MODELFLOW_SECRET_KEY is required}
      MODELFLOW_BOOTSTRAP_ADMIN_EMAIL: ${MODELFLOW_BOOTSTRAP_ADMIN_EMAIL:?MODELFLOW_BOOTSTRAP_ADMIN_EMAIL is required}
      MODELFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${MODELFLOW_BOOTSTRAP_ADMIN_PASSWORD:?MODELFLOW_BOOTSTRAP_ADMIN_PASSWORD is required}
      MODELFLOW_ENCRYPTION_KEY: ${MODELFLOW_ENCRYPTION_KEY:?MODELFLOW_ENCRYPTION_KEY is required}
      MODELFLOW_GIT_SHA: ${MODELFLOW_GIT_SHA:-unknown}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      SOURCE_MYSQL_HOST: mysql-source
      SOURCE_MYSQL_PORT: "3306"
      SOURCE_MYSQL_USER: ${SOURCE_MYSQL_USER:-}
      SOURCE_MYSQL_PASSWORD: ${SOURCE_MYSQL_PASSWORD:-}
      SOURCE_MYSQL_DB: ${SOURCE_MYSQL_DB:-}
      SOURCE_MARIADB_HOST: mariadb-source
      SOURCE_MARIADB_PORT: "3306"
      SOURCE_MARIADB_USER: ${SOURCE_MARIADB_USER:-}
      SOURCE_MARIADB_PASSWORD: ${SOURCE_MARIADB_PASSWORD:-}
      SOURCE_MARIADB_DB: ${SOURCE_MARIADB_DB:-}
      SOURCE_MSSQL_HOST: mssql-source
      SOURCE_MSSQL_PORT: "1433"
      SOURCE_MSSQL_USER: ${SOURCE_MSSQL_USER:-}
      SOURCE_MSSQL_PASSWORD: ${SOURCE_MSSQL_PASSWORD:-}
      SOURCE_MSSQL_DB: ${SOURCE_MSSQL_DB:-}
      SOURCE_MSSQL_SA_PASSWORD: ${SOURCE_MSSQL_SA_PASSWORD:-}
      SOURCE_ORACLE_HOST: oracle-source
      SOURCE_ORACLE_PORT: "1521"
      SOURCE_ORACLE_USER: ${SOURCE_ORACLE_USER:-}
      SOURCE_ORACLE_PASSWORD: ${SOURCE_ORACLE_PASSWORD:-}
      SOURCE_ORACLE_SERVICE_NAME: ${SOURCE_ORACLE_SERVICE_NAME:-}
      SOURCE_ORACLE_APP_USER: ${SOURCE_ORACLE_APP_USER:-}
      SOURCE_ORACLE_APP_PASSWORD: ${SOURCE_ORACLE_APP_PASSWORD:-}
      SOURCE_ORACLE_SYSTEM_PASSWORD: ${SOURCE_ORACLE_SYSTEM_PASSWORD:-}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  worker:
    build:
      context: ./backend
    depends_on:
      backend:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_SECURE: "false"
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      AWS_DEFAULT_REGION: us-east-1
      WORKER_POLL_SECONDS: "2"
      WORKER_ID: default
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: "30"
      MODELFLOW_SECRET_KEY: ${MODELFLOW_SECRET_KEY:?MODELFLOW_SECRET_KEY is required}
      MODELFLOW_ENCRYPTION_KEY: ${MODELFLOW_ENCRYPTION_KEY:?MODELFLOW_ENCRYPTION_KEY is required}
      MODELFLOW_GIT_SHA: ${MODELFLOW_GIT_SHA:-unknown}
    command: python -m app.workers.runner
    healthcheck:
      test: ["CMD-SHELL", "python -m app.workers.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  postgres_source_data:
  mysql_source_data:
  mariadb_source_data:
  mssql_source_data:
  oracle_source_data:
  minio_data:
