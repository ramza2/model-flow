upstream modelflow_backend {
    zone modelflow_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Copilot draft/patch can exceed the default 60s proxy_read_timeout while the
    # backend waits on the LLM. Regex locations beat the prefix /api/ match so only
    # these paths get the extended wait; URI + query string stay unchanged.
    location ~ ^/api/v1/projects/[0-9]+/pipeline-copilot/(draft|patch)$ {
        proxy_pass http://modelflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://modelflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
