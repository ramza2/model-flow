# Optional Phase 8-D file-secret mount overlay.
#
# Usage:
#   docker compose --env-file .env.deploy \
#     -f docker-compose.yml \
#     -f docker-compose.traefik.yml \
#     -f docker-compose.secret-files.yml up -d
#
# MODELFLOW_SECRET_HOST_DIR must contain service-specific subdirectories:
#   backend/
#   worker/
#   inference-runtime/
#
# Set supported *_FILE variables to paths inside /run/model-flow-secrets.
# No secret values belong in this file.

services:
  backend:
    volumes:
      - ${MODELFLOW_SECRET_HOST_DIR:?MODELFLOW_SECRET_HOST_DIR is required}/backend:/run/model-flow-secrets:ro

  worker:
    volumes:
      - ${MODELFLOW_SECRET_HOST_DIR:?MODELFLOW_SECRET_HOST_DIR is required}/worker:/run/model-flow-secrets:ro

  inference-runtime:
    volumes:
      - ${MODELFLOW_SECRET_HOST_DIR:?MODELFLOW_SECRET_HOST_DIR is required}/inference-runtime:/run/model-flow-secrets:ro
