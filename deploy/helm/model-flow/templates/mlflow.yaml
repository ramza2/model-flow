apiVersion: v1
kind: Service
metadata:
  name: {{ include "model-flow.fullname" . }}-mlflow
  labels:
    {{- include "model-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: mlflow
spec:
  selector:
    {{- include "model-flow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "model-flow.fullname" . }}-mlflow
  labels:
    {{- include "model-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: mlflow
spec:
  replicas: {{ .Values.mlflow.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "model-flow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mlflow
  template:
    metadata:
      labels:
        {{- include "model-flow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mlflow
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mlflow
          image: "{{ .Values.images.mlflow.repository }}:{{ .Values.images.mlflow.tag }}"
          imagePullPolicy: {{ .Values.images.mlflow.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              exec mlflow server
              --host 0.0.0.0
              --port 5000
              --allowed-hosts "{{ include "model-flow.fullname" . }}-mlflow:5000,localhost:*,127.0.0.1:*"
              --backend-store-uri "$MLFLOW_BACKEND_STORE_URI"
              --default-artifact-root "{{ .Values.mlflow.artifactRoot }}"
              --serve-artifacts
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: MLFLOW_BACKEND_STORE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "model-flow.secretName" . }}
                  key: {{ .Values.secret.keys.mlflowDatabaseUrl }}
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "{{ ternary "https" "http" .Values.external.objectStore.secure }}://{{ .Values.external.objectStore.endpoint }}"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "model-flow.secretName" . }}
                  key: {{ .Values.secret.keys.objectStoreAccessKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "model-flow.secretName" . }}
                  key: {{ .Values.secret.keys.objectStoreSecretKey }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.external.objectStore.region | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mlflow.resources | nindent 12 }}
      {{- with .Values.mlflow.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mlflow.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mlflow.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
